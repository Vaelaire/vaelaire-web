<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="640" viewBox="370 110 800 640"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vaelaire logo — black</title>
  <desc id="desc">Single-colour black variant of the Vaelaire logo. Use on light backgrounds, for print, embossing and one-colour applications.</desc>

  <!-- V monogram — all fills flat black -->
  <g transform="translate(768 260)">

    <!-- Left blade -->
    <path d="M -128 -78
             C -96 -76, -76 -57, -58 -27
             L 0 86
             L 26 48
             L -37 -51
             C -58 -83, -88 -96, -128 -78 Z"
          fill="#000000"/>

    <!-- Right blade -->
    <path d="M 8 86
             L 92 -51
             C 108 -77, 125 -91, 150 -96
             L 35 79 Z"
          fill="#000000"/>

    <!-- Gold accent — solid black in one-colour version -->
    <path d="M 50 -1
             C 78 -61, 104 -87, 150 -96
             C 115 -66, 84 -26, 50 18 Z"
          fill="#000000"/>
  </g>

  <!-- Wordmark -->
  <text x="768" y="608"
        text-anchor="middle"
        fill="#000000"
        font-family="Didot, 'Bodoni MT', 'Times New Roman', serif"
        font-size="118"
        font-weight="400"
        letter-spacing="9">VAELAIRE</text>

  <!-- Signature lines -->
  <line x1="422" y1="678" x2="530" y2="678" stroke="#000000" stroke-width="3"/>
  <line x1="1006" y1="678" x2="1114" y2="678" stroke="#000000" stroke-width="3"/>

  <!-- Signature phrase -->
  <text x="768" y="694"
        text-anchor="middle"
        fill="#000000"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="34"
        font-weight="500"
        letter-spacing="8">STAY AT VAELAIRE</text>
</svg>
